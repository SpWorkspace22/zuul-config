- hosts: localhost
  gather_facts: false

  vars:
    zuul_log_url: "http://localhost:8080"
    zuul_log_path: "{{ zuul.build[:3] }}/{{ zuul.tenant }}/{{ zuul.build }}"
    generate_zuul_manifest_root: "/srv/static/logs/{{ zuul_log_path }}"
    generate_zuul_manifest_output: "/srv/static/logs/{{ zuul_log_path }}/zuul-manifest.json"

  tasks:
    - name: Create published log directory
      ansible.builtin.file:
        path: "/srv/static/logs/{{ zuul_log_path }}"
        state: directory
        mode: "0755"
        recurse: true

    - name: Copy executor logs to published log storage
      ansible.builtin.copy:
        src: "{{ zuul.executor.log_root }}/"
        dest: "/srv/static/logs/{{ zuul_log_path }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Generate Zuul manifest and register artifact
      ansible.builtin.include_role:
        name: generate-zuul-manifest

    - name: Register published log URL with Zuul
      zuul_return:
        data:
          zuul:
            log_url: "{{ zuul_log_url }}/{{ zuul_log_path }}/"
