- pipeline:
    name: check
    description: Run CI jobs for GitHub pull requests.
    manager: independent
    trigger:
      github:
        - event: pull_request
          action: opened
        - event: pull_request
          action: changed
        - event: pull_request
          action: reopened
        - event: pull_request
          action: comment
          comment:
            - '(?i)^\s*recheck\s*$'
    start:
      github:
        check: in_progress
    success:
      github:
        check: success
    failure:
      github:
        check: failure

- pipeline:
    name: gate
    description: Test pull requests labeled gate before merging.
    manager: dependent
    trigger:
      github:
        - event: pull_request
          action: labeled
          label: gate
    require:
      github:
        label: gate
        open: true
        current-patchset: true
    start:
      github:
        check: in_progress
    success:
      github:
        check: success
        merge: true
    failure:
      github:
        check: failure
    dequeue:
      github:
        check: cancelled
